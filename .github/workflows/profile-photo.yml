name: Update academic profile photo

on:
  push:
    paths:
      - '.github/workflows/profile-photo.yml'

permissions:
  contents: write

jobs:
  update-avatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage avatar
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'https://avatars.githubusercontent.com/u/73155178?v=4'
          new = '/images/pengxiang-lan.jpg'
          if old not in text:
              raise SystemExit('Current avatar URL not found in index.html')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit homepage update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use new academic profile photo'
          git push
